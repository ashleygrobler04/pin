<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible 10-Pin Bowling</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
            border: 2px solid #333;
            border-radius: 1rem;
            background-color: #242424;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover { background-color: #0056b3; }
        .status {
            margin-top: 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffd700;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
    <script defer src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script defer src="./script.js"></script>
</head>
<body>
    <main class="container">
        <h1>Accessible 10-Pin Bowling</h1>
        
        <div id="setup-ui">
            <button id="start-btn">Play vs Computer</button>
            <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #444;">
            <h3>Online Multiplayer</h3>
            <div style="display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1rem;">
                <button id="host-btn">Host Game</button>
                <button id="join-btn">Join Game</button>
            </div>
            <div id="join-input-area" style="display: none; margin-bottom: 1rem;">
                <input type="text" id="join-id" placeholder="Enter Host ID" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
                <button id="confirm-join-btn">Connect</button>
            </div>
            <div id="peer-id-display" style="display: none; margin-bottom: 1rem; font-family: monospace; color: #00ff00; background: #111; padding: 1rem; border-radius: 8px;">
                <div>Your Host ID: <span id="my-id" style="font-weight: bold; letter-spacing: 1px;">...</span></div>
                <button id="copy-id-btn" style="padding: 0.5rem 1rem; font-size: 0.9rem; margin-top: 0.5rem; background-color: #444;">Copy ID to Clipboard</button>
            </div>
        </div>

        <div id="game-ui" style="display: none;">
            <canvas id="game-canvas" width="400" height="500" style="background: #000; border: 4px solid #444; border-radius: 8px; margin-bottom: 1rem;"></canvas>
            <div id="score-board" style="display: flex; justify-content: space-around; margin-bottom: 1rem; font-size: 1.2rem; color: #00d4ff;">
                <div>Player 1: <span id="p1-score">0</span></div>
                <div>Player 2: <span id="p2-score">0</span></div>
            </div>
            <div id="frame-info" style="font-size: 0.9rem; color: #888; margin-bottom: 1rem;">
                Frame: <span id="current-frame">1</span> / 10
            </div>
        </div>
        
        <div id="game-info" class="status">
            Choose a game mode above.
        </div>

        <div id="announcer" class="sr-only" aria-live="polite"></div>

        <section id="instructions" style="margin-top: 2rem; font-size: 0.9rem; color: #aaa;">
            <p>1. Listen to the <strong>beep</strong> moving left to right. Press <strong>SPACE</strong> to lock your angle.</p>
            <p>2. Listen to the <strong>looping tone</strong>. Higher pitch means more power. Press <strong>SPACE</strong> to throw.</p>
        </section>
    </main>
</body>
</html>
